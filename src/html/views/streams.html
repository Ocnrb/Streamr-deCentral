<!-- ===== STREAMS LIST VIEW ===== -->
<div id="streams-list-view" class="hidden px-2 md:px-6 py-4 md:py-6 space-y-4 overflow-x-hidden">

    <!-- Search Bar (matches operators/delegators style) + Create Stream button -->
    <div class="mb-2 flex items-center gap-2">
        <div class="relative flex-1 min-w-0">
            <input
                type="search"
                id="streams-search-input"
                placeholder="Search by Stream ID..." 
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                data-form-type="other"
                data-lpignore="true"
                data-1p-ignore="true"
                class="w-full h-12 pl-11 pr-4 bg-[#1E1E1E] border border-[#333333] rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
            >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
        <button id="streams-create-btn" disabled title="Connect a wallet (MetaMask or private key) to create a stream"
            class="h-12 px-3 md:px-4 flex items-center gap-2 bg-blue-800 hover:bg-blue-900 text-white text-sm font-semibold rounded-xl transition-colors flex-shrink-0 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-800">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
            <span class="hidden sm:inline">Create Stream</span>
        </button>
    </div>

    <!-- Tab Navigation - Professional Tab Markers -->
    <div class="relative border-b border-[#333] overflow-x-auto">
        <div class="flex min-w-max">
            <button id="streams-tab-nonsponsored" class="streams-tab relative px-3 md:px-6 py-3 md:py-4 text-xs md:text-sm font-semibold transition-all flex items-center gap-2 md:gap-3 text-white border-b-2 border-blue-500 bg-gradient-to-t from-blue-500/10 to-transparent">
                <div class="flex items-center justify-center w-6 h-6 md:w-8 md:h-8 rounded-lg bg-gray-500/20">
                    <img src="/assets/stream_icon.png" alt="Streams" class="w-3 h-3 md:w-4 md:h-4">
                </div>
                <div class="flex flex-col items-start">
                    <span>All Streams</span>
                </div>
                <span id="streams-tab-nonsponsored-count" class="ml-1 md:ml-2 px-1.5 md:px-2.5 py-0.5 md:py-1 text-xs font-bold bg-green-500/20 text-green-400 rounded-md">0</span>
            </button>
            <button id="streams-tab-sponsorships" class="streams-tab relative px-3 md:px-6 py-3 md:py-4 text-xs md:text-sm font-semibold transition-all flex items-center gap-2 md:gap-3 text-gray-400 hover:text-white border-b-2 border-transparent hover:border-gray-600">
                <div class="flex items-center justify-center w-6 h-6 md:w-8 md:h-8 rounded-lg bg-gray-500/20">
                    <svg class="w-4 h-4 md:w-5 md:h-5" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="28" cy="28" r="28" fill="#F7600A"/>

                    </svg>
                </div>
                <div class="flex flex-col items-start">
                    <span>Sponsorships</span>
                </div>
                <span id="streams-tab-sponsorships-count" class="ml-1 md:ml-2 px-1.5 md:px-2.5 py-0.5 md:py-1 text-xs font-bold bg-gray-500/20 text-gray-400 rounded-md">0</span>
            </button>
        </div>
    </div>

    <!-- Sponsorships Panel -->
    <div id="streams-panel-sponsorships" class="hidden bg-[#1E1E1E] border border-[#333] rounded-xl overflow-hidden">
        <div class="px-4 md:px-6 py-4 border-b border-[#333] flex items-center justify-end">
            <div class="flex items-center gap-4">
                <!-- Zero Balance Toggle -->
                <label class="flex items-center gap-2 cursor-pointer group select-none">
                    <span class="text-xs font-medium text-gray-500 group-hover:text-gray-300 transition-colors whitespace-nowrap">Inactive</span>
                    <div class="relative">
                        <input type="checkbox" id="streams-show-zero-balance-toggle" class="sr-only peer">
                        <div class="w-8 h-4 bg-[#333333] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-800"></div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Table Container -->
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-xs text-gray-500 uppercase bg-[#252525] font-semibold tracking-wider">
                    <tr>
                        <th class="px-4 py-3 text-left whitespace-nowrap">Stream ID</th>
                        <th id="sponsorships-sort-payout" class="px-4 py-3 text-right whitespace-nowrap cursor-pointer hover:text-white transition-colors group" data-sort="payout">
                            <span class="inline-flex items-center gap-1">
                                Payout (DATA/day)
                                <svg class="w-3 h-3 opacity-0 group-hover:opacity-50 transition-opacity sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                            </span>
                        </th>
                        <th id="sponsorships-sort-apy" class="px-4 py-3 text-right whitespace-nowrap cursor-pointer hover:text-white transition-colors group text-blue-400" data-sort="apy">
                            <span class="inline-flex items-center gap-1">
                                APY
                                <svg class="w-3 h-3 opacity-100 sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </span>
                        </th>
                        <th id="sponsorships-sort-staked" class="px-4 py-3 text-right whitespace-nowrap cursor-pointer hover:text-white transition-colors group" data-sort="staked">
                            <span class="inline-flex items-center gap-1">
                                Staked (DATA)
                                <svg class="w-3 h-3 opacity-0 group-hover:opacity-50 transition-opacity sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                            </span>
                        </th>
                        <th id="sponsorships-sort-operators" class="px-4 py-3 text-right whitespace-nowrap cursor-pointer hover:text-white transition-colors group" data-sort="operators">
                            <span class="inline-flex items-center gap-1">
                                Operators
                                <svg class="w-3 h-3 opacity-0 group-hover:opacity-50 transition-opacity sort-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                            </span>
                        </th>
                    </tr>
                </thead>
                <tbody id="sponsorships-tbody" class="text-gray-300 divide-y divide-[#333]">
                    <!-- Rows populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div id="sponsorships-empty" class="hidden py-12 text-center">
            <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5M12 12h.01M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
            </svg>
            <p class="text-gray-400">No sponsorships found</p>
        </div>

        <!-- Load More -->
        <div class="px-4 py-4 border-t border-[#333] text-center">
            <button id="load-more-sponsorships-btn" class="bg-[#2C2C2C] hover:bg-[#3A3A3A] text-white font-medium py-2 px-6 rounded-lg transition-colors text-sm hidden">
                Load More
            </button>
        </div>
    </div>

    <!-- Non-Sponsorships Panel -->
    <div id="streams-panel-nonsponsored" class="bg-[#1E1E1E] border border-[#333] rounded-xl overflow-hidden">
        <!-- Table Container -->
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-xs text-gray-500 uppercase bg-[#252525] font-semibold tracking-wider">
                    <tr>
                        <th class="px-4 py-3 text-left whitespace-nowrap">Stream ID</th>
                        <th class="px-4 py-3 text-center whitespace-nowrap w-12"></th>
                        <th class="px-4 py-3 text-center whitespace-nowrap w-12"></th>
                        <th class="px-4 py-3 text-center whitespace-nowrap w-12"></th>
                        <th class="px-4 py-3 text-center whitespace-nowrap w-12"></th>
                        <th class="px-4 py-3 text-right whitespace-nowrap hidden md:table-cell">Created</th>
                    </tr>
                </thead>
                <tbody id="nonsponsorships-tbody" class="text-gray-300 divide-y divide-[#333]">
                    <!-- Rows populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div id="nonsponsorships-empty" class="hidden py-12 text-center">
            <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5M12 12h.01M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
            </svg>
            <p class="text-gray-400">No streams found</p>
        </div>

        <!-- Load More -->
        <div class="px-4 py-4 border-t border-[#333] text-center">
            <button id="load-more-nonsponsored-btn" class="bg-[#2C2C2C] hover:bg-[#3A3A3A] text-white font-medium py-2 px-6 rounded-lg transition-colors text-sm hidden">
                Load More
            </button>
        </div>
    </div>

</div>
