<!-- ===== MOBILE HEADER - hidden until login ===== -->
<header id="mobile-header" class="hidden fixed top-0 left-0 right-0 z-30 bg-[#121212]/95 backdrop-blur-md border-b border-[#2a2a2a]">
    <div class="flex items-center justify-between px-4 h-14">
        <!-- Page Title -->
        <div class="flex items-center gap-3">
            <!-- Back Button (shown only on detail pages; replaces the logo) -->
            <button id="mobile-back-btn" class="hidden p-1.5 -ml-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition-all" title="Back" aria-label="Back">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <img id="mobile-header-logo" src="/favicon/favicon.ico" alt="" class="w-8 h-8 flex-shrink-0">
            <h1 id="mobile-page-title" class="text-lg font-bold text-white">Operators</h1>
            <!-- Save Operator Profile Button (shown only on operator detail) -->
            <button id="mobile-save-profile-btn" class="hidden p-1.5 rounded-lg text-gray-400 hover:text-yellow-400 hover:bg-white/10 transition-all" title="Save as your profile shortcut">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
            </button>
            <!-- Save Delegator Profile Button (shown only on delegator detail) -->
            <button id="mobile-save-delegator-profile-btn" class="hidden p-1.5 rounded-lg text-gray-400 hover:text-purple-400 hover:bg-white/10 transition-all" title="Save as your profile shortcut">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
            </button>
        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-2">
            <!-- DATA Price (compact) -->
            <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-[#1E1E1E] border border-[#333]">
                <span class="text-[10px] text-gray-400">DATA:</span>
                <span id="mobile-data-price" class="text-xs font-bold text-green-400">--</span>
            </div>

            <!-- Wallet Button -->
            <div class="relative">
                <button id="mobile-wallet-btn" class="p-2 rounded-lg bg-[#1E1E1E] border border-[#333] text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>

<!-- ===== DESKTOP HEADER - hidden until login ===== -->
<header id="desktop-header" class="hidden fixed top-0 right-0 z-30 bg-[#121212]/95 backdrop-blur-md border-b border-[#2a2a2a] transition-all duration-300 left-[72px] lg:left-72">
    <div class="flex items-center justify-between px-4 md:px-6 h-14 w-full">
        <!-- Left: Page Title -->
        <div class="flex items-center gap-3">
            <!-- Back Button (shown only on detail pages) -->
            <button id="desktop-back-btn" class="hidden p-1.5 -ml-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition-all" title="Back" aria-label="Back">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h1 id="desktop-page-title" class="text-lg font-semibold text-white">Operators</h1>
            <!-- Save Operator Profile Button (shown only on operator detail) -->
            <button id="desktop-save-profile-btn" class="hidden p-1.5 rounded-lg text-gray-400 hover:text-yellow-400 hover:bg-white/10 transition-all" title="Save as your profile shortcut">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
            </button>
            <!-- Save Delegator Profile Button (shown only on delegator detail) -->
            <button id="desktop-save-delegator-profile-btn" class="hidden p-1.5 rounded-lg text-gray-400 hover:text-purple-400 hover:bg-white/10 transition-all" title="Save as your profile shortcut">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
            </button>
        </div>

        <!-- Right: DATA Price only -->
        <div class="flex items-center gap-3">
            <!-- DATA Price -->
            <div id="data-price-box" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#333]">
                <span class="text-xs text-gray-400">DATA:</span>
                <span id="data-price-value" class="text-sm font-bold text-green-400">--</span>
            </div>

            <!-- Global Autostaker Status Indicator -->
            <button id="autostaker-global-indicator" class="hidden relative p-2 rounded-lg bg-[#1E1E1E] border border-green-600/50 text-green-500 hover:bg-[#2a2a2a] transition-colors" title="Autostaker Running">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span class="absolute top-1 right-1 w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            </button>
        </div>
    </div>
</header>
