<!-- ===== SIDEBAR (Desktop) - hidden until login ===== -->
<aside id="app-sidebar" class="hidden flex-col fixed left-0 top-0 h-full w-[72px] lg:w-72 bg-[#1A1A1A] border-r border-[#2a2a2a] z-40 transition-all duration-300">
    <!-- Logo -->
    <div id="sidebar-logo" class="relative h-14 flex items-center justify-center lg:justify-start border-b border-[#2a2a2a]">
        <img src="/favicon/favicon.ico" alt="" class="w-11 h-11 min-w-[40px] min-h-[40px] flex-shrink-0 object-contain">
        <span class="hidden lg:block ml-3 text-lg font-bold text-white whitespace-nowrap">Streamr deCentral</span>
        <!-- Desktop: compact sidebar (icons only). Compact: it takes the logo's place on hover -->
        <button id="sidebar-compact-toggle" type="button" aria-label="Collapse the sidebar" aria-expanded="true" data-tooltip="Expand the sidebar"
            class="hidden lg:inline-flex flex-shrink-0 ml-auto mr-2 w-8 h-8 items-center justify-center rounded-md text-gray-500 hover:text-white hover:bg-white/5 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path class="sidebar-toggle-chevron" d="m16 15-3-3 3-3"/></svg>
        </button>
    </div>

    <!-- Your Profiles Section (hidden by default, shown when any profile is saved) -->
    <div id="sidebar-profiles-section" class="hidden px-2 py-3 border-b border-[#2a2a2a] space-y-2">
        <!-- Operator Profile -->
        <a id="sidebar-operator-profile-link" href="#" class="hidden group flex items-center justify-center lg:justify-start gap-3 px-3 py-2 rounded-md text-white hover:bg-[#2a2a2a] transition-all duration-200 relative">
            <img id="sidebar-operator-profile-avatar" src="" alt="" class="rounded-full border-2 border-blue-500/50 flex-shrink-0 object-cover" style="width: 44px; height: 44px; min-width: 44px; min-height: 44px;">
            <div class="hidden lg:flex lg:flex-col flex-1 min-w-0 pt-0.5">
                <span class="text-[9px] font-semibold text-blue-400 uppercase tracking-widest leading-tight">Operator</span>
                <p id="sidebar-operator-profile-name" class="text-sm font-medium text-white truncate leading-tight"></p>
            </div>
            <button id="sidebar-operator-profile-remove" class="hidden lg:flex absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 p-1 rounded-md hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-all" title="Remove shortcut">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </a>

        <!-- Delegator Profile -->
        <a id="sidebar-delegator-profile-link" href="#" class="hidden group flex items-center justify-center lg:justify-start gap-3 px-3 py-2 rounded-md text-white hover:bg-[#2a2a2a] transition-all duration-200 relative">

            <div class="hidden lg:flex lg:flex-col flex-1 min-w-0 pt-0.5">
                <span class="text-[9px] font-semibold text-purple-400 uppercase tracking-widest leading-tight">Delegator</span>
                <p id="sidebar-delegator-profile-name" class="text-sm font-medium text-white truncate leading-tight"></p>
            </div>
            <button id="sidebar-delegator-profile-remove" class="hidden lg:flex absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 p-1 rounded-md hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-all" title="Remove shortcut">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </a>
    </div>
